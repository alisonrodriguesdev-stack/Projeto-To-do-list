<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="singUp.css">
</head>
<body>
    <Div class="container">
        <div class="cadastro">
            <h2>Cadastro</h2>
            
            <form action="">
               
                <div class="input-box">
                    <input type="text" placeholder="Nome Completo" id="IDName" class="Name"> 
                </div>
               
                <div class="input-box">
                    <input type="text" placeholder="Email" id="IDEmail" class="Email">
                </div>
               
                <div class="input-box">
                    <input type="text" placeholder="Nome de Usuário" id="Username" class="User">
                </div>
              
                <div class="input-box">
                    <input type="text" placeholder="Criar Senha" id="Password" class="PW">
                </div>
              
                <div class="input-box">
                    <input type="text" placeholder="Confirmar Senha" id="PSWConfirm" class="Confirm">
                </div>

                <button class="ButtonCad" id="BtCad">Cadastrar</button>     
                
                <p class="HP" id="HaveP">
                    <a href="" class="HP" >Possuo Cadastro</a>
                </p>

            </form>
        </div>
    </Div>
       <script src="singUp.js"></script>
    
</body>
</html>
