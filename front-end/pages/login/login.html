<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <div class="login-card">
            <h2>Login</h2>

            <form action="">

                <div class="input-box">
                    <span class="icon"> <i class="fa-solid fa-user"></i></span>
                    <input type="text" placeholder="Email" id="idEmail" class="email">
                </div>
                <div class="input-box">
                    <span class="icon"><i class="fa-solid fa-lock"></i> </span>
                    <label for="email"></label>
                    <input type="password" placeholder="Senha" class="senha" id="idPassword">
                </div>
                <div class="options">

                    <div>
                        <input type="checkbox" name="lembrar">
                        <label for="lembrar">Lembrar-me</label>
                    </div>

                    <a href="" class="link"> Esqueceu a senha? </a>

                </div>

                <button class="btn" id="bttn"> Entrar </button>


                <p class="link-p">
                    <a href="" class="link-p"> Não tenho uma Conta </a>
                </p>

            </form>

        </div>

    </div>
        <script src="login.js"></script>
</body>

</html>
