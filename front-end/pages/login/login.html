<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>Login</h2>

            <form action="">

            <div class="input-box">
                <span class="icon"> <i class="fa-solid fa-user"></i></span>
                <input type="text" placeholder="Email" id="idEmail" class="email" >
            </div>
            <div class="input-box">
                <span class="icon"> <i class="fa-solid fa-lock"></i> </span>
                <label for="email">Email</label>
                <input type="password" placeholder="Senha" class="senha" id="idPassword">
            </div>
            <div class="options">
             
                <input type="checkbox" name="lembrar">
                <label for="lembrar">Lembrar-me</label> 
                
                <a href="#" class="link"> Esqueceu a senha? </a>
                
            </div>
            
            <button class="btn" type="submit" id="btnLogin"> Entrar </button>

            <p class="link-p">
                <a href=""> Nao tenho uma Conta </a>
            </p>

            </form>
            
        </div>

    </div>
    <script type="module" src="login.js"></script>
</body>
</html>
